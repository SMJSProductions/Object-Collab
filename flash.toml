[project]
name = "Object Collab"
version = "v0.5.4-beta.1"
repository = "https://github.com/SMJSProductions/Object-Collab"
icon = "logo.png"

[tutorials]
dir = "docs"
assets = [
    "docs/assets/*.png"
]

[templates]
head = "docs/templates/head.html"

[[scripts.css]]
name = "custom.css"
content = "docs/templates/custom.css"

[[scripts.css]]
name = "default.css"
content = "docs/templates/flash/default.css"

[[scripts.css]]
name = "content.css"
content = "docs/templates/flash/content.css"

[[scripts.css]]
name = "nav.css"
content = "docs/templates/flash/nav.css"

[[scripts.css]]
name = "themes.css"
content = "docs/templates/flash/themes.css"

[include]
patterns-full = [
    "^object_collab"
]

[[sources]]
name = "Object Collab"
dir = "include"
include = [
    "*.hpp"
]

[cmake]
config-args = [
     "-G", "Ninja",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DGEODE_DISABLE_PRECOMPILED_HEADERS=ON",
    "-DGEODE_CODEGEN_CMAKE_ARGS=-DCMAKE_CXX_COMPILER=clang++;-DCMAKE_C_COMPILER=clang"
]
build-dir = "build_docs"
infer-args-from = "src/api_impl/object_collab.cpp"